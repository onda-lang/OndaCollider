name: Build OndaCollider

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      onda_run_id:
        description: Onda build run providing unpublished SDKs; empty uses the pinned release
        type: string
        default: ''
      onda_source_ref:
        description: Full Onda source commit of the unpublished SDK run
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      source_ref: ${{ github.sha }}
      onda_run_id: ${{ inputs.onda_run_id || '' }}
      onda_source_ref: ${{ inputs.onda_source_ref || '' }}
    secrets: inherit

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download tested packages
        uses: actions/download-artifact@v7
        with:
          pattern: Onda-*.zip
          path: dist
          merge-multiple: true

      - name: Publish release packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          files=(dist/Onda-*.zip)
          test "${#files[@]}" -eq 3
          for file in "${files[@]}"; do test -s "$file"; done
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" == true ]]; then
              gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --notes '' --repo "$GITHUB_REPOSITORY"
          fi
